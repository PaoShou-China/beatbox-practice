async function audioReady(){ctx ||= new(window.AudioContext||window.webkitAudioContext)();if(!master){master=ctx.createGain();master.connect(ctx.destination);}master.gain.value=+$('volume').value/100;await ctx.resume();}
function tone(freq,t,dur,v){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur);}
function sound(s,t){if(s==='B'){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(.65,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(master);o.start(t);o.stop(t+.21);}else if(s!=='—'){const dur=s==='T'?.055:s==='O'?.3:.14,b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=b;f.type=s==='K'?'bandpass':'highpass';f.frequency.value=s==='T'||s==='O'?6500:s==='K'?2100:1300;g.gain.setValueAtTime(s==='T'?.2:.35,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f).connect(g).connect(master);n.start(t);n.stop(t+dur);if(s==='PF')tone(180,t,.08,.16);}}
function schedule(){if(!running)return;while(next<ctx.currentTime+.1){const d=+$('division').value,i=pos,t=next,inCount=bar<countBars,practiceBar=bar-countBars,mute=+$('mute').value,silent=!inCount&&mute>0&&Math.floor(practiceBar/mute)%2===1;if(!inCount)gridTimes.push(t);gridTimes=gridTimes.filter(v=>v>ctx.currentTime-2);if(!silent){if($('demo').checked&&!inCount)sound(steps[i],t);if(($('click').checked||inCount)&&i%d===0)tone(i===0?1300:850,t,.035,.15);}const id=setTimeout(()=>{visualTimers=visualTimers.filter(v=>v!==id);if(!running)return;[...$('grid').children].forEach((b,k)=>b.classList.toggle('active',!inCount&&k===i));$('barStatus').textContent=inCount?tr('ready')+' '+(Math.floor(i/d)+1):tr('bar')+' '+(practiceBar+1)+' · '+tr(silent?'silent':'audible');},Math.max(0,(t-ctx.currentTime)*1000));visualTimers.push(id);const swing=d===2?+$('swing').value:0;next+=60/(+$('bpm').value)/d*(1+(i%2===0?swing:-swing));pos++;if(pos===steps.length){pos=0;bar++;if(bar>countBars&&(bar-countBars)%4===0&&+$('ramp').value>0){const cap=Math.max(40,Math.min(200,Number($('target').value)||120));const current=+$('bpm').value;if(current<cap){$('bpm').value=String(Math.min(cap,current+(+$('ramp').value)));tempo();}}}}}
function accrue(){if(!running)return;const end=Date.now(),elapsed=end-runStart;sessionMs+=elapsed;runMs+=elapsed;totalMs+=elapsed;let at=runStart;while(at<end){const d=new Date(at),tomorrow=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),part=Math.min(end,tomorrow)-at;const key=dayKey(d);days[key]=(Number(days[key])||0)+part;at+=part;}runStart=end;}
function stop(complete=false){if(!running)return;accrue();running=false;clearInterval(schedulerTimer);visualTimers.forEach(clearTimeout);visualTimers=[];if(master&&ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(0,ctx.currentTime);master.gain.setValueAtTime(+$('volume').value/100,ctx.currentTime+.5);}persist();$('play').textContent=tr('start');[...$('grid').children].forEach(b=>b.classList.remove('active'));if(complete)$('barStatus').textContent=tr('complete');updateClock();renderChart();}
async function toggle(){if(running){stop();return;}if(starting)return;starting=true;try{await audioReady();running=true;runStart=Date.now();runMs=0;runLimit=+$('duration').value*1000;countBars=+$('countIn').value;pos=0;bar=0;gridTimes=[];next=ctx.currentTime+.55;$('play').textContent=tr('stop');schedule();schedulerTimer=setInterval(schedule,25);}catch(e){$('barStatus').textContent=tr('audioError');}finally{starting=false;}}
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updateClock(){const extra=running?Date.now()-runStart:0;$('clock').textContent=fmt(sessionMs+extra);$('total').textContent=tr('total')+' '+((totalMs+extra)/60000).toFixed(1)+' '+tr('minutes');$('progress').max=runLimit||1;$('progress').value=runLimit?Math.min(runLimit,runMs+extra):0;if(running&&runLimit&&runMs+extra>=runLimit)stop(true);}
function tempo(){$('bpmValue').textContent=$('bpm').value;persist();}
function renderChart(){const ds=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return {key:dayKey(d),date:d};});const max=Math.max(60000,...ds.map(d=>Number(days[d.key])||0));$('chart').replaceChildren(...ds.map(d=>{const el=document.createElement('div'),ms=Number(days[d.key])||0;el.className='day';el.style.height=Math.max(3,ms/max*80)+'px';el.title=d.key+' · '+(ms/60000).toFixed(1)+' '+tr('minutes');const s=document.createElement('small');s.textContent=(d.date.getMonth()+1)+'/'+d.date.getDate();el.append(s);return el;}));}
function renderPads(){$('pads').replaceChildren(...Object.keys(soundNames).map(s=>{const b=document.createElement('button');b.className='pad';const strong=document.createElement('b');strong.textContent=s;const small=document.createElement('span');small.textContent=soundNames[s][lang==='zh'?0:1]+' · '+(s==='PF'?'P':s);b.append(strong,small);b.onclick=()=>hit(s);return b;}));$('pads').style.gridTemplateColumns='repeat(5,minmax(0,1fr))';}
async function hit(s){try{await audioReady();const now=ctx.currentTime;sound(s,now);if(running&&gridTimes.length){const nearest=gridTimes.reduce((best,t)=>Math.abs(t-now)<Math.abs(best-now)?t:best);lastOffset=(now-nearest)*1000;offsets.push(Math.abs(lastOffset));if(offsets.length>500)offsets.shift();renderFeedback();}}catch(e){$('feedback').textContent=tr('audioError');}}
function renderFeedback(){$('hitCount').textContent=offsets.length;$('offset').textContent=lastOffset===null?'—':(lastOffset>=0?'+':'')+Math.round(lastOffset);$('steady').textContent=offsets.length?Math.round(offsets.reduce((a,b)=>a+b,0)/offsets.length):'—';$('feedback').textContent=(lastOffset===null?'':tr(Math.abs(lastOffset)<40?'onTime':lastOffset<0?'early':'late')+' · ')+tr('feedbackHint');}
const lessons=[['B',['双唇轻闭，积一点气压，短促弹开，类似不带元音的 b。避免念成“波”。','Close your lips gently, build a little pressure, then release a short b without a vowel.']],['T',['舌尖靠近上门牙后，短促释放 ts 气流，保持轻巧清晰。','Place the tongue near the back of the upper teeth and release a short, crisp ts.']],['PF',['先练唇爆破 p，再接短 f 气流，连成紧凑的小鼓音。','Practice a lip pop p, then a short f release; combine into a compact snare.']],['K',['舌后部靠近上腭，积压后短促释放。先用呼气方向练习，不要强吸气。','Place the back of the tongue near the palate and release a short k burst. Start with an outward airflow.']],['O',['延长 T 的气流形成开放镲；对比短 T 与长 O，保持音量均匀。','Extend the airflow of T into an open hat. Alternate short T and long O at an even volume.']]];
function renderLessons(){$('lessons').replaceChildren(...lessons.map(([s,body])=>{const el=document.createElement('details'),su=document.createElement('summary'),p=document.createElement('p');su.textContent=s+' / '+soundNames[s][lang==='zh'?0:1];p.textContent=body[lang==='zh'?0:1];el.append(su,p);return el;}));}
function renderLibrary(){$('library').replaceChildren(...presets.map((p,i)=>{const b=document.createElement('button');b.className='preset';const title=document.createElement('b'),s=document.createElement('small'),n=document.createElement('small');title.textContent=String(i+1).padStart(2,'0')+' / '+name(p);s.textContent=p.s;n.textContent=p.b+' BPM · '+tr(p.d===1?'quarter':p.d===2?'eighth':p.d===3?'triplet':'sixteenth');b.append(title,s,n);b.onclick=()=>{applyPreset(i);$('studio')?.scrollIntoView();$('pattern').focus();};return b;}));}
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localise();persist();};$('play').onclick=toggle;$('pattern').onchange=()=>{if(+$('pattern').value>=0)applyPreset(+$('pattern').value);else selection=-1;};$('reset').onclick=()=>applyPreset(selection>=0?selection:0);$('random').onclick=()=>{stop();steps=Array.from({length:4*(+$('division').value)},(_,i)=>i===0?'B':i===Math.floor(steps.length/2)?'PF':codes[Math.floor(Math.random()*codes.length)]);selection=-1;$('pattern').value='-1';renderGrid();persist();};$('division').onchange=()=>{stop();const old=steps.slice();steps=Array.from({length:4*(+$('division').value)},(_,i)=>old[i]||'—');selection=-1;$('pattern').value='-1';renderGrid();persist();};$('bpm').oninput=tempo;['slower','faster'].forEach((k,i)=>$(k).onclick=()=>{$('bpm').value=String(Math.max(40,Math.min(200,+$('bpm').value+(i?5:-5))));tempo();});$('volume').oninput=()=>{if(master)master.gain.value=+$('volume').value/100;persist();};['swing','mute','duration','ramp','target','countIn','demo','click'].forEach(k=>$(k).onchange=()=>{if(['duration','countIn'].includes(k))stop();persist();});$('tap').onclick=()=>{const now=performance.now();if(taps.length&&now-taps.at(-1)>2000)taps=[];taps.push(now);if(taps.length>6)taps.shift();if(taps.length>1){$('bpm').value=String(Math.max(40,Math.min(200,Math.round(60000*(taps.length-1)/(now-taps[0])))));tempo();}};$('clearHits').onclick=()=>{offsets=[];lastOffset=null;renderFeedback();};
function currentPattern(){return {version:1,title:$('name').value.trim()||tr('custom'),division:+$('division').value,bpm:+$('bpm').value,swing:+$('swing').value,steps:steps.slice()};}
$('savePattern').onclick=()=>{if(!$('name').value.trim()){$('fileStatus').textContent=tr('emptyName');return;}const p=currentPattern(),i=saved.findIndex(x=>x.title===p.title);if(i>=0)saved[i]=p;else{saved.push(p);if(saved.length>50)saved.shift();}savedOptions();$('fileStatus').textContent=tr(persist()?'saved':'saveError');};function loadPattern(p){stop();steps=p.steps.slice();$('division').value=String(p.division);$('bpm').value=String(Math.max(40,Math.min(200,Number(p.bpm)||80)));$('swing').value=['0','0.12','0.24','0.32'].includes(String(p.swing))?String(p.swing):'0';$('name').value=String(p.title||'').slice(0,48);selection=-1;$('pattern').value='-1';renderGrid();tempo();$('fileStatus').textContent=tr('loaded');persist();}$('load').onclick=()=>{const p=saved[+$('saved').value];if(p)loadPattern(p);};$('delete').onclick=()=>{if(saved.length&&confirm(tr('resetConfirm'))){saved.splice(+$('saved').value,1);savedOptions();persist();$('fileStatus').textContent=tr('removed');}};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(currentPattern(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='beatbox-pattern.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('import').onchange=async()=>{try{const f=$('import').files[0];if(!f)return;if(f.size>50000)throw Error();const p=JSON.parse(await f.text());if(!validPattern(p))throw Error();loadPattern(p);}catch(e){$('fileStatus').textContent=tr('invalid');}finally{$('import').value='';}};
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.code==='Space'){e.preventDefault();toggle();}else{const k=e.key.toUpperCase();if(['B','T','P','K','O'].includes(k))hit(k==='P'?'PF':k);}});
function cleanMic(){stream?.getTracks().forEach(t=>t.stop());clearInterval(recordTimer);clearTimeout(recordLimit);$('record').classList.remove('recording');$('record').textContent=tr('record');}
function renderTakes(){$('takes').replaceChildren(...takes.map((take,i)=>{const el=document.createElement('div');el.className='take';const title=document.createElement('div');title.textContent=tr('take')+' '+(i+1)+' · '+take.date.toLocaleTimeString(lang==='zh'?'zh-CN':'en-US')+' · '+fmt(take.ms);const audio=document.createElement('audio');audio.controls=true;audio.src=take.url;const row=document.createElement('div');row.className='row';const speed=document.createElement('select');speed.setAttribute('aria-label',tr('playback'));[.5,.75,1,1.25,1.5].forEach(n=>speed.add(new Option(n+'×',String(n))));speed.value=String(take.speed||1);audio.playbackRate=take.speed||1;speed.onchange=()=>{take.speed=+speed.value;audio.playbackRate=+speed.value;};const a=document.createElement('a');a.href=take.url;a.download=take.filename;a.textContent=tr('download');const remove=document.createElement('button');remove.textContent=tr('removeTake');remove.onclick=()=>{audio.pause();URL.revokeObjectURL(take.url);takes.splice(i,1);renderTakes();};row.append(speed,a,remove);el.append(title,audio,row);return el;}));}
$('record').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();return;}if(recordBusy)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){statusKey='recordUnsupported';$('recordStatus').textContent=tr(statusKey);return;}recordBusy=true;$('record').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data);};recorder.onstop=()=>{const elapsed=Date.now()-recordStart;cleanMic();const blob=new Blob(recordChunks,{type:recorder.mimeType});const ext=blob.type.includes('mp4')?'.m4a':blob.type.includes('ogg')?'.ogg':'.webm';takes.unshift({url:URL.createObjectURL(blob),filename:'beatbox-'+new Date().toISOString().replace(/[:.]/g,'-')+ext,date:new Date(),ms:elapsed,speed:1});if(takes.length>5)URL.revokeObjectURL(takes.pop().url);renderTakes();statusKey='recordDone';$('recordStatus').textContent=tr(statusKey);};recorder.onerror=()=>{cleanMic();statusKey='recordError';$('recordStatus').textContent=tr(statusKey);};recorder.start(1000);recordStart=Date.now();statusKey='recording';$('recordStatus').textContent=tr(statusKey);$('record').textContent=tr('recordStop');$('record').classList.add('recording');recordTimer=setInterval(()=>{$('recordTime').textContent=fmt(Date.now()-recordStart)+' / 05:00';},250);recordLimit=setTimeout(()=>{if(recorder.state==='recording')recorder.stop();},300000);}catch(e){cleanMic();statusKey=e.name==='NotAllowedError'?'recordPermission':'recordError';$('recordStatus').textContent=tr(statusKey);}finally{recordBusy=false;$('record').disabled=false;}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',()=>{stop();if(recorder?.state==='recording')recorder.stop();cleanMic();takes.forEach(t=>URL.revokeObjectURL(t.url));});tempo();localise();setInterval(()=>{updateClock();if(running&&Date.now()-runStart>10000){accrue();persist();}},250);
</script></html>
