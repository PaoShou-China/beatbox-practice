function renderClassics(){const n=lang==='zh'?0:1,level=$('classicLevel').value,video=$('videoLanguage').value;const list=classicRoutines.filter(p=>(level==='all'||p.level===level)&&(video==='all'||p.video===video));$('classicCards').replaceChildren(...list.map(p=>{const card=document.createElement('article');card.className='classic-card';const badges=document.createElement('div');[tr(p.level),tr(p.video==='zh'?'chineseVideo':'englishVideo')].forEach(text=>{const b=document.createElement('span');b.className='badge';b.textContent=text;badges.append(b);});const title=document.createElement('h3');title.textContent=p.title[n];const source=document.createElement('p');source.className='note';source.textContent=tr('teacher')+' · '+(Array.isArray(p.source)?p.source[n]:p.source);const goal=document.createElement('p');goal.textContent=tr('goal')+' · '+p.focus[n];const videoLink=document.createElement('a');videoLink.href=p.url;videoLink.target='_blank';videoLink.rel='noopener noreferrer';videoLink.textContent=tr('watchVideo')+' ↗';const heading=document.createElement('h4');heading.textContent=tr('practiceSteps');const ol=document.createElement('ol');p.plan.forEach(line=>{const li=document.createElement('li');li.textContent=line[n];ol.append(li);});const label=document.createElement('p');label.className='note';label.textContent=tr('prepScore')+' · '+p.b+' BPM';const score=document.createElement('div');score.className='score';score.textContent=p.score;const buttons=document.createElement('div');buttons.className='stage-buttons';buttons.style.marginTop='12px';['practiceSkeleton','practiceSlow','practiceTarget'].forEach((key,stage)=>{const b=document.createElement('button');b.textContent=tr(key);b.onclick=()=>{const arr=p.score.split(' ');loadPattern({title:p.title[n]+' / '+tr('basis'),division:p.d,bpm:stage===2?p.b:60,swing:0,steps:stage===0?arr.map(x=>x==='T'||x==='O'?'—':x):arr});$('mute').value='0';$('ramp').value='0';$('countIn').value='1';$('demo').checked=true;$('click').checked=true;persist();$('fileStatus').textContent=tr('practiceLoaded');$('pattern').scrollIntoView({block:'center'});$('pattern').focus();};buttons.append(b);});const hint=document.createElement('p');hint.className='note';hint.textContent=tr('stageHint');card.append(badges,title,source,goal,videoLink,heading,ol,label,score,buttons,hint);return card;}));}
$('classicLevel').onchange=renderClassics;$('videoLanguage').onchange=renderClassics;
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localise();persist();};$('play').onclick=toggle;$('pattern').onchange=()=>{if(+$('pattern').value>=0)applyPreset(+$('pattern').value);else selection=-1;};$('reset').onclick=()=>applyPreset(selection>=0?selection:0);$('random').onclick=()=>{stop();steps=Array.from({length:4*(+$('division').value)},(_,i)=>i===0?'B':i===Math.floor(steps.length/2)?'PF':codes[Math.floor(Math.random()*codes.length)]);selection=-1;$('pattern').value='-1';renderGrid();persist();};$('division').onchange=()=>{stop();const old=steps.slice();steps=Array.from({length:4*(+$('division').value)},(_,i)=>old[i]||'—');selection=-1;$('pattern').value='-1';renderGrid();persist();};$('bpm').oninput=tempo;['slower','faster'].forEach((k,i)=>$(k).onclick=()=>{$('bpm').value=String(Math.max(40,Math.min(200,+$('bpm').value+(i?5:-5))));tempo();});$('volume').oninput=()=>{if(master)master.gain.value=+$('volume').value/100;persist();};['swing','mute','duration','ramp','target','countIn','demo','click'].forEach(k=>$(k).onchange=()=>{if(['duration','countIn'].includes(k))stop();persist();});$('tap').onclick=()=>{const now=performance.now();if(taps.length&&now-taps.at(-1)>2000)taps=[];taps.push(now);if(taps.length>6)taps.shift();if(taps.length>1){$('bpm').value=String(Math.max(40,Math.min(200,Math.round(60000*(taps.length-1)/(now-taps[0])))));tempo();}};$('clearHits').onclick=()=>{offsets=[];lastOffset=null;renderFeedback();};
function currentPattern(){return {version:1,title:$('name').value.trim()||tr('custom'),division:+$('division').value,bpm:+$('bpm').value,swing:+$('swing').value,steps:steps.slice()};}
$('savePattern').onclick=()=>{if(!$('name').value.trim()){$('fileStatus').textContent=tr('emptyName');return;}const p=currentPattern(),i=saved.findIndex(x=>x.title===p.title);if(i>=0)saved[i]=p;else{saved.push(p);if(saved.length>50)saved.shift();}savedOptions();$('fileStatus').textContent=tr(persist()?'saved':'saveError');};function loadPattern(p){stop();steps=p.steps.slice();$('division').value=String(p.division);$('bpm').value=String(Math.max(40,Math.min(200,Number(p.bpm)||80)));$('swing').value=['0','0.12','0.24','0.32'].includes(String(p.swing))?String(p.swing):'0';$('name').value=String(p.title||'').slice(0,48);selection=-1;$('pattern').value='-1';renderGrid();tempo();$('fileStatus').textContent=tr('loaded');persist();}$('load').onclick=()=>{const p=saved[+$('saved').value];if(p)loadPattern(p);};$('delete').onclick=()=>{if(saved.length&&confirm(tr('resetConfirm'))){saved.splice(+$('saved').value,1);savedOptions();persist();$('fileStatus').textContent=tr('removed');}};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(currentPattern(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='beatbox-pattern.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('import').onchange=async()=>{try{const f=$('import').files[0];if(!f)return;if(f.size>50000)throw Error();const p=JSON.parse(await f.text());if(!validPattern(p))throw Error();loadPattern(p);}catch(e){$('fileStatus').textContent=tr('invalid');}finally{$('import').value='';}};
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.code==='Space'){e.preventDefault();toggle();}else{const k=e.key.toUpperCase();if(['B','T','P','K','O'].includes(k))hit(k==='P'?'PF':k);}});
function cleanMic(){stream?.getTracks().forEach(t=>t.stop());clearInterval(recordTimer);clearTimeout(recordLimit);$('record').classList.remove('recording');$('record').textContent=tr('record');}
function renderTakes(){$('takes').replaceChildren(...takes.map((take,i)=>{const el=document.createElement('div');el.className='take';const title=document.createElement('div');title.textContent=tr('take')+' '+(i+1)+' · '+take.date.toLocaleTimeString(lang==='zh'?'zh-CN':'en-US')+' · '+fmt(take.ms);const audio=document.createElement('audio');audio.controls=true;audio.src=take.url;const row=document.createElement('div');row.className='row';const speed=document.createElement('select');speed.setAttribute('aria-label',tr('playback'));[.5,.75,1,1.25,1.5].forEach(n=>speed.add(new Option(n+'×',String(n))));speed.value=String(take.speed||1);audio.playbackRate=take.speed||1;speed.onchange=()=>{take.speed=+speed.value;audio.playbackRate=+speed.value;};const a=document.createElement('a');a.href=take.url;a.download=take.filename;a.textContent=tr('download');const remove=document.createElement('button');remove.textContent=tr('removeTake');remove.onclick=()=>{audio.pause();URL.revokeObjectURL(take.url);takes.splice(i,1);renderTakes();};row.append(speed,a,remove);el.append(title,audio,row);return el;}));}
$('record').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();return;}if(recordBusy)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){statusKey='recordUnsupported';$('recordStatus').textContent=tr(statusKey);return;}recordBusy=true;$('record').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data);};recorder.onstop=()=>{const elapsed=Date.now()-recordStart;cleanMic();const blob=new Blob(recordChunks,{type:recorder.mimeType});const ext=blob.type.includes('mp4')?'.m4a':blob.type.includes('ogg')?'.ogg':'.webm';takes.unshift({url:URL.createObjectURL(blob),filename:'beatbox-'+new Date().toISOString().replace(/[:.]/g,'-')+ext,date:new Date(),ms:elapsed,speed:1});if(takes.length>5)URL.revokeObjectURL(takes.pop().url);renderTakes();statusKey='recordDone';$('recordStatus').textContent=tr(statusKey);};recorder.onerror=()=>{cleanMic();statusKey='recordError';$('recordStatus').textContent=tr(statusKey);};recorder.start(1000);recordStart=Date.now();statusKey='recording';$('recordStatus').textContent=tr(statusKey);$('record').textContent=tr('recordStop');$('record').classList.add('recording');recordTimer=setInterval(()=>{$('recordTime').textContent=fmt(Date.now()-recordStart)+' / 05:00';},250);recordLimit=setTimeout(()=>{if(recorder.state==='recording')recorder.stop();},300000);}catch(e){cleanMic();statusKey=e.name==='NotAllowedError'?'recordPermission':'recordError';$('recordStatus').textContent=tr(statusKey);}finally{recordBusy=false;$('record').disabled=false;}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',()=>{stop();if(recorder?.state==='recording')recorder.stop();cleanMic();takes.forEach(t=>URL.revokeObjectURL(t.url));});tempo();localise();setInterval(()=>{updateClock();if(running&&Date.now()-runStart>10000){accrue();persist();}},250);
</script></html>
